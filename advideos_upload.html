<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad Video Studio | Upload</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(circle at top right, #1e1b4b, transparent),
          radial-gradient(circle at bottom left, #1e293b, transparent);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        padding: 2rem;
        border-radius: 1.5rem;
        border: 1px solid var(--border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }

      .back-btn {
        background: var(--border);
        color: var(--text);
        padding: 0.5rem 1rem;
        border-radius: 0.75rem;
        text-decoration: none;
        font-size: 0.875rem;
        transition: all 0.2s;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        color: white;
        box-sizing: border-box;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 1.5rem;
      }

      .drop-zone:hover,
      .drop-zone.drag-over {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.05);
      }

      .drop-zone svg {
        width: 48px;
        height: 48px;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }

      button[type="submit"] {
        width: 100%;
        padding: 0.75rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.1s,
          background 0.2s;
      }

      button[type="submit"]:hover {
        background: var(--primary-hover);
      }
      button[type="submit"]:active {
        transform: scale(0.98);
      }

      .progress-container {
        display: none;
        margin-top: 1.5rem;
      }

      .progress-bar {
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      #progressFill {
        height: 100%;
        width: 0%;
        background: var(--primary);
        transition: width 0.3s;
      }

      #log {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: var(--text-muted);
        max-height: 100px;
        overflow-y: auto;
        padding: 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Upload Ad</h2>
        <a href="./advideos.html" class="back-btn">← Back</a>
      </div>

      <form id="uploadForm">
        <div class="input-group">
          <label for="caption">Caption</label>
          <input
            type="text"
            id="caption"
            name="caption"
            placeholder="Write a catchy caption..."
            required
          />
        </div>

        <div class="drop-zone" id="dropZone">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            ></path>
          </svg>
          <p id="fileName">Drag video here or click to browse</p>
          <input
            type="file"
            id="video"
            accept="video/*"
            style="display: none"
            required
          />
        </div>

        <button type="submit" id="submitBtn">Start Upload</button>
      </form>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
          "
        >
          <span id="statusText">Uploading...</span>
          <span id="percentText">0%</span>
        </div>
      </div>

      <div id="log"></div>
    </div>

    <script>
      const form = document.getElementById("uploadForm");
      const videoInput = document.getElementById("video");
      const dropZone = document.getElementById("dropZone");
      const fileNameDisplay = document.getElementById("fileName");
      const progressContainer = document.getElementById("progressContainer");
      const progressFill = document.getElementById("progressFill");
      const percentText = document.getElementById("percentText");
      const log = document.getElementById("log");

      // Drag & Drop Handlers
      dropZone.onclick = () => videoInput.click();
      dropZone.ondragover = (e) => {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      };
      dropZone.ondragleave = () => dropZone.classList.remove("drag-over");
      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        videoInput.files = e.dataTransfer.files;
        updateFileName();
      };

      function getLoggedUserId() {
        const userStr = localStorage.getItem("mlm_user");
        if (userStr) {
          try {
            const user = JSON.parse(userStr);
            return user.id || user._id;
          } catch (e) {
            console.error("Error parsing user from localStorage", e);
            return null;
          }
        }
        return null;
      }

      /**
       * 2. SECURITY CHECK
       * Immediately redirect if no user is found in session
       */
      const currentUserId = getLoggedUserId();
      if (!currentUserId) {
        alert("⚠️ Please login first to upload videos.");
        window.location.href = "login.html";
      }

      videoInput.onchange = updateFileName;

      function updateFileName() {
        if (videoInput.files.length) {
          fileNameDisplay.textContent = `Selected: ${videoInput.files[0].name}`;
          fileNameDisplay.style.color = "var(--primary)";
        }
      }

      function write(msg) {
        log.textContent += msg + "\n";
        log.scrollTop = log.scrollHeight;
      }

      // Fetch fresh ID from storage for the request
      const userId = getLoggedUserId();
      // if (!userId) return alert("Session expired. Please log in again.");

      form.onsubmit = async (e) => {
        e.preventDefault();
        log.textContent = "";
        progressContainer.style.display = "block";

        const data = new FormData();
        data.append("userId", userId);
        data.append("video", videoInput.files[0]);
        data.append("caption", document.getElementById("caption").value);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "http://localhost:3000/api/advideos/upload", true);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressFill.style.width = percent + "%";
            percentText.textContent = percent + "%";
          }
        };

        xhr.onload = () => {
          const resp = JSON.parse(xhr.responseText);
          write(`✅ Status ${xhr.status}: ${resp.message || "Complete"}`);
          document.getElementById("statusText").textContent =
            "Processing started!";
        };

        xhr.onerror = () => write("❌ Upload failed.");
        xhr.send(data);
      };
    </script>
  </body>
</html>
