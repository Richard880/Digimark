<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Hub | Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet" />
    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      #out::-webkit-scrollbar {
        width: 6px;
      }
      #out::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="bg-indigo-600 p-2 rounded-lg text-white">
            <i class="fas fa-wallet fa-lg"></i>
          </div>
          <h1 class="text-xl font-bold text-slate-800 tracking-tight">
            Finance <span class="text-indigo-600">Hub</span>
          </h1>
        </div>

        <div class="flex items-center gap-4">
          <div
            class="hidden md:flex items-center gap-2 bg-emerald-50 border border-emerald-100 px-4 py-1.5 rounded-xl"
          >
            <span class="text-[10px] font-bold text-emerald-600 uppercase"
              >Balance</span
            >
            <span
              id="nav-balance"
              class="text-sm font-black text-emerald-700 font-mono"
              >$0.00</span
            >
          </div>
          <div
            id="session-info"
            class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200"
          >
            <div
              class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
            ></div>
            <span
              id="active-user"
              class="text-xs font-mono font-bold text-slate-600 uppercase tracking-tighter"
              >No Session</span
            >
          </div>
          <a
            href="./dashboard.html"
            class="text-sm font-semibold text-slate-500 hover:text-indigo-600"
            >Dashboard</a
          >
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Action Forms -->
        <div class="lg:col-span-8 space-y-6">
          <!-- 1. Balance Highlight Card -->
          <div
            class="bg-gradient-to-br from-indigo-600 to-violet-700 p-8 rounded-3xl shadow-xl shadow-indigo-100 text-white relative overflow-hidden"
          >
            <div class="relative z-10">
              <p class="text-indigo-100 text-sm font-medium mb-1">
                Available Funds
              </p>
              <h2
                id="main-balance"
                class="text-4xl font-black tracking-tight font-mono mb-6"
              >
                $0.00
              </h2>
              <button
                onclick="checkBalance()"
                class="bg-white/20 hover:bg-white/30 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2"
              >
                <i class="fas fa-redo-alt"></i> Refresh Wallet
              </button>
            </div>
            <div
              class="absolute -right-10 -bottom-10 w-48 h-48 bg-white/10 rounded-full blur-3xl"
            ></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Deposit -->
            <div class="glass-card p-6 rounded-2xl shadow-sm">
              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"
              >
                <i class="fas fa-arrow-down text-emerald-500"></i> Deposit
              </h3>
              <div class="flex gap-2">
                <input
                  id="depositAmt"
                  type="number"
                  value="50"
                  class="flex-1 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <button
                  onclick="doDeposit()"
                  class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-indigo-100 transition-all active:scale-95"
                >
                  Add
                </button>
              </div>
            </div>

            <!-- Transfer -->
            <div class="glass-card p-6 rounded-2xl shadow-sm">
              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"
              >
                <i class="fas fa-paper-plane text-blue-500"></i> Send Money
              </h3>
              <div class="space-y-3">
                <input
                  id="transferTo"
                  placeholder="Recipient User ID"
                  class="w-full border border-slate-200 rounded-xl p-3 outline-none"
                />
                <div class="flex gap-2">
                  <input
                    id="transferAmt"
                    type="number"
                    value="5"
                    class="flex-1 border border-slate-200 rounded-xl p-3 outline-none"
                  />
                  <button
                    onclick="doTransfer()"
                    class="bg-slate-800 hover:bg-black text-white px-6 py-3 rounded-xl font-bold transition-all active:scale-95"
                  >
                    Send
                  </button>
                </div>
              </div>
            </div>

            <!-- Withdraw -->
            <div
              class="glass-card p-6 rounded-2xl shadow-sm bg-red-50/30 border-red-100"
            >
              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"
              >
                <i class="fas fa-university text-red-500"></i> Withdraw
              </h3>
              <input
                id="withdrawAmt"
                type="number"
                placeholder="Amount"
                class="w-full border border-slate-200 rounded-xl p-3 mb-3 outline-none"
              />
              <button
                onclick="doWithdraw()"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-100 transition-all"
              >
                Confirm Withdrawal
              </button>
            </div>

            <!-- Payment -->
            <div class="glass-card p-6 rounded-2xl shadow-sm">
              <h3
                class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"
              >
                <i class="fas fa-shopping-cart text-indigo-500"></i> Merchant
                Pay
              </h3>
              <input
                id="payTarget"
                placeholder="Merchant ID"
                class="w-full border border-slate-200 rounded-xl p-3 mb-3 outline-none"
              />
              <div class="flex gap-2">
                <input
                  id="payAmt"
                  type="number"
                  placeholder="Amt"
                  class="flex-1 border border-slate-200 rounded-xl p-3 outline-none"
                />
                <button
                  onclick="doPayment()"
                  class="bg-indigo-900 hover:bg-black text-white px-6 py-3 rounded-xl font-bold transition-all"
                >
                  Pay
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Console Output -->
        <div class="lg:col-span-4 flex flex-col h-full min-h-[500px]">
          <div
            class="bg-slate-900 rounded-3xl shadow-2xl flex flex-col flex-1 overflow-hidden border border-slate-800"
          >
            <div
              class="bg-slate-800/50 px-5 py-3 flex items-center justify-between border-b border-slate-800 text-[10px] font-bold text-slate-400 uppercase tracking-widest"
            >
              <span>Transaction Log</span>
              <button
                onclick="showTxs()"
                class="text-indigo-400 hover:text-indigo-300"
              >
                <i class="fas fa-sync-alt mr-1"></i> Refresh
              </button>
            </div>
            <pre
              id="out"
              class="p-6 text-indigo-300 font-mono text-xs overflow-auto leading-relaxed flex-1"
            >
System ready...</pre
            >
          </div>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Plan Selection Card -->
        <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <i class="fas fa-star text-amber-500"></i> Active Plan
            </h3>
            <select id="plan" class="w-full border-slate-200 rounded-xl p-3 mb-3 focus:ring-2 focus:ring-indigo-500 outline-none border bg-white cursor-pointer">
                <option value="24h">24h Standard Access (KES 50)</option>
                <option value="7d">7 Days Premium (KES 250)</option>
                <option value="30d">30 Days Pro (KES 1000)</option>
            </select>
            <button onclick="buyPlan()" class="w-full border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-bold py-3 rounded-xl transition-all active:scale-95">
                Upgrade Subscription
            </button>
        </div>
    
    </main>

    <script>
      const COMM_API = "http://localhost:3000/api/commissions";
      const WALLET_API = "http://localhost:3000/api/wallets";

      // 1. Rename the function to avoid conflict with the ID "out"
      function updateLog(s) {
        const el = document.getElementById("out");
        if (!el) return;
        const content = typeof s === "string" ? s : JSON.stringify(s, null, 2);
        // Prepends the new log to the top
        el.innerHTML =
          `<span class="text-slate-500">[${new Date().toLocaleTimeString()}]</span>\n${content}\n\n` +
          el.innerHTML;
      }

      function getSessionUserId() {
        const userJson = localStorage.getItem("mlm_user");
        const display = document.getElementById("active-user");
        if (userJson) {
          try {
            const userData = JSON.parse(userJson);
            const userId = userData.id || userData._id;
            if (userId) {
              display.innerText = userId;
              return userId;
            }
          } catch (e) {
            console.error("Parse error", e);
          }
        }
        display.innerText = "NO SESSION";
        return null;
      }

      function getHeaders() {
        const uid = getSessionUserId();
        if (!uid) return null;
        return { "Content-Type": "application/json", "x-user-id": uid };
      }

      async function checkBalance() {
        const h = getHeaders();
        if (!h) return;

        try {
          const r = await fetch(`${WALLET_API}/balance`, {
            method: "GET",
            headers: h,
          });
          const data = await r.json();

          console.log("Debug Wallet Data:", data); // Check your console to see the structure

          // FIX: Access the .wallet property from your API response
          const walletObj = data.wallet;

          // Extract the balance from the wallet object
          const balanceValue =
            walletObj && typeof walletObj.balance === "number"
              ? walletObj.balance
              : 0;

          const fmt = new Intl.NumberFormat("en-KE", {
            style: "currency",
            currency: "KES",
          }).format(balanceValue);

          // Update the UI elements
          document.getElementById("nav-balance").innerText = fmt;
          document.getElementById("main-balance").innerText = fmt;

          updateLog({ action: "Balance Sync", balance: balanceValue });
        } catch (e) {
          console.error("Sync Error:", e);
          updateLog("Sync Error: " + e.message);
        }
      }

      // 2. Update doDeposit to use updateLog and handle the .wallet wrapper
      async function doDeposit() {
        const h = getHeaders();
        if (!h) return;

        const amt = Number(document.getElementById("depositAmt").value);
        if (amt <= 0) return alert("Enter a valid amount");

        try {
          const r = await fetch(`${WALLET_API}/deposit`, {
            method: "POST",
            headers: h,
            body: JSON.stringify({ amount: amt, method: "mpesa" }),
          });

          const data = await r.json();

          // Use the new log function name
          updateLog(data);

          // Refresh balance immediately after success
          if (r.ok) {
            checkBalance();
            document.getElementById("depositAmt").value = "";
          }
        } catch (e) {
          updateLog("Deposit Error: " + e.message);
        }
      }

      async function doTransfer() {
        const h = getHeaders();
        if (!h) return;
        const to = document.getElementById("transferTo").value;
        const amt = Number(document.getElementById("transferAmt").value);
        const r = await fetch(`${WALLET_API}/transfer`, {
          method: "POST",
          headers: h,
          body: JSON.stringify({ toUserId: to, amount: amt }),
        });
        out(await r.json());
        checkBalance();
      }

      async function doWithdraw() {
        const h = getHeaders();
        if (!h) return;
        const amt = Number(document.getElementById("withdrawAmt").value);
        const r = await fetch(`${WALLET_API}/withdraw`, {
          method: "POST",
          headers: h,
          body: JSON.stringify({ amount: amt }),
        });
        out(await r.json());
        checkBalance();
      }

      async function doPayment() {
        const h = getHeaders();
        if (!h) return;
        const target = document.getElementById("payTarget").value;
        const amt = Number(document.getElementById("payAmt").value);
        const r = await fetch(`${WALLET_API}/pay`, {
          method: "POST",
          headers: h,
          body: JSON.stringify({ merchantId: target, amount: amt }),
        });
        out(await r.json());
        checkBalance();
      }

      async function buyPlan() {
        const h = getHeaders(); 
        if(!h) return;
    
        const plan = document.getElementById("plan").value;
    
        try {
            // This hits your /purchase/float endpoint in api/wallets.js
            const r = await fetch(`${WALLET_API}/purchase/float`, {
                method: "POST",
                headers: h,
                body: JSON.stringify({ plan: plan }),
            });
    
            const data = await r.json();
            
            // Log the response
            updateLog({
                action: "Subscription Attempt",
                plan: plan,
                response: data
            });
    
            if(r.ok) {
                alert(`Successfully subscribed to ${plan}!`);
                checkBalance(); // Refresh balance to show deduction
            } else {
                alert(`Error: ${data.error || 'Failed to purchase plan'}`);
            }
        } catch (e) {
            updateLog("Subscription Error: " + e.message);
        }
    }
    

      async function showTxs() {
        const h = getHeaders();
        if (!h) return;
        const r = await fetch(`${WALLET_API}/transactions`, {
          method: "GET",
          headers: h,
        });
        out(await r.json());
      }
      let refreshTimer;

      /**
       * Starts the automatic balance refresh
       * Every 30,000 milliseconds (30 seconds)
       */
      function startAutoRefresh() {
        // Clear any existing timer first to prevent memory leaks or duplicates
        if (refreshTimer) clearInterval(refreshTimer);

        refreshTimer = setInterval(() => {
          console.log("Auto-refreshing balance...");
          checkBalance();
        }, 30000); // 30 seconds
      }

      // Modify your window.onload to include the timer
      window.onload = () => {
        getSessionUserId();
        checkBalance();
        startAutoRefresh(); // <--- Initialize the timer here
      };
    </script>
  </body>
</html>
