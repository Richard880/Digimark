    <main

                ></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
      const SERVER = "http://localhost:3000";
      const API_BASE = `${SERVER}/api/videos`;
      const urlParams = new URLSearchParams(window.location.search);
      const VIDEO_ID = urlParams.get("id");
      let nextVideoId = null;

      async function loadPage() {
        console.log("🚀 Initializing Page for ID:", VIDEO_ID);
        if (!VIDEO_ID) {
          document.getElementById("playingTitle").innerText = "No Video Selected";
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/${VIDEO_ID}`);
          if (!res.ok) throw new Error("Metadata 404");
          const video = await res.json();

          document.getElementById("playingTitle").innerText = video.title || "Untitled";
          document.getElementById("uploaderName").innerText = video.userId || "Anonymous";
          document.getElementById("uploaderInitial").innerText = (video.userId || "U").charAt(0).toUpperCase();

          const lvl = video.level || 1;
          const avatar = document.getElementById("uploaderAvatar");
          if (avatar) {
            document.getElementById("uploaderLevel").innerText = lvl;
            avatar.className = `w-14 h-14 rounded-full flex items-center justify-center bg-slate-800 lvl-${lvl}`;
          }

          await startStream(); // Logic below
          await loadSidebar();
        } catch (err) {
          console.error("❌ Page Load Error:", err);
        }
      }

      async function startStream() {
        const videoElem = document.getElementById("video");
        const previewUrl = `${SERVER}/api/videos/${VIDEO_ID}/preview/master.m3u8`;
        const fullUrl = `${SERVER}/api/videos/${VIDEO_ID}/full/master.m3u8`;
        
        // Fetch User ID from your specific storage key
        const mlmUser = JSON.parse(localStorage.getItem("mlm_user") || "{}");
        const userId = mlmUser.id;

        if (!userId) {
            alert("Please log in first.");
            return;
        }

        let streamToken = null;

        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({
            xhrSetup: (xhr) => {
              if (streamToken) xhr.setRequestHeader("X-Stream-Token", streamToken);
            }
          });

          hls.attachMedia(videoElem);
          setupCustomControls(videoElem);

          // 1. Show Preview immediately while we check subscription
          hls.loadSource(previewUrl);

          // 2. THE GATEKEEPER: Check float balance via token request
          console.log("🛡️ Checking float balance...");
          try {
            const tokenRes = await fetch(`${SERVER}/api/stream/token?videoId=${VIDEO_ID}`, {
              headers: { "x-user-id": userId }
            });

            if (tokenRes.status === 402) {
              // NO FLOAT: Prompt for purchase
              const buy = confirm("🎬 Account Inactive\n\nYou need an active Float to watch the full video. Buy subscription now?");
              if (buy) window.location.href = "subscription.html"; 
              return; 
            }

            if (tokenRes.ok) {
              const data = await tokenRes.json();
              streamToken = data.token;
              
              // ACCOUNT ACTIVE: Upgrade to Full Video
              console.log("✅ Float Active. Loading Full Video...");
              hls.loadSource(fullUrl); 
             // videoElem.muted = true;
              videoElem.play();
            }
          } catch (err) {
            console.error("Auth check failed", err);
          }
        }
      }

      function setupCustomControls(video) {
        const playBtn = document.getElementById("playBtn");
        const playIcon = document.getElementById("playIcon");
        const progressBar = document.getElementById("progressBar");
        const progressArea = document.getElementById("progressArea");

        playBtn.onclick = () => video.paused ? video.play() : video.pause();
        
        video.ontimeupdate = () => {
          const percent = (video.currentTime / video.duration) * 100;
          progressBar.style.width = percent + "%";
          document.getElementById("currTime").innerText = formatTime(video.currentTime);
          document.getElementById("durTime").innerText = formatTime(video.duration);
        };

        progressArea.onclick = (e) => {
          const rect = progressArea.getBoundingClientRect();
          video.currentTime = ((e.pageX - rect.left) / rect.width) * video.duration;
        };

        function formatTime(s) {
          let m = Math.floor(s / 60);
          let sec = Math.floor(s % 60);
          return m + ":" + (sec < 10 ? "0" + sec : sec);
        }
      }


      async function loadSidebar(){
        try {
          const res = await fetch(
            `${SERVER}/api/feed/recommendations/${VIDEO_ID}`,
          );
          const result = await res.json();
          
          const list = document.getElementById("recommended-list");
          if (result.success && result.data.length > 0) {
            list.innerHTML = result.data
              .map((v) => {
                // 1. PLACE LOGIC HERE: Check if this item is the one currently playing
                const isPlayingStyle =
                  v.id === VIDEO_ID
                    ? "border: 2px solid #60a5fa; background: #334155;"
                    : "";
                const nowPlayingBadge =
                  v.id === VIDEO_ID
                    ? '<span style="color: #60a5fa; font-size: 10px;">▶ NOW PLAYING</span><br>'
                    : "";

                // 2. APPLY STYLE TO THE DIV:
                return `
                <div class="glass flex gap-3 p-2 rounded-2xl cursor-pointer" onclick="location.href='watch.html?id=${v.id}'">
                  <img src="${SERVER}/${v.thumbnail}" class="w-24 aspect-video rounded-lg object-cover">
                  <div>
                    <h4 class="text-xs font-bold text-white">${v.title}</h4>
                    <p class="text-[10px] text-slate-500">${v.userId}</p>
                  </div>
                </div>
              `;
              })
              .join("");
          } else {
            recList.innerHTML = "No related videos yet.";
          }
        } catch (err) {
          console.error("Feed error:", err);
        }
      }


   
      function smartBack() {
        const referrer = document.referrer;
    
        // Check if the previous page was MyStudio
        if (referrer.includes('myVideos.html') || referrer.includes('myStudio')) {
            window.location.href = 'myVideos.html';
        } 
        // Otherwise, default to Library
        else {
            window.location.href = 'library.html';
        }
    }
     
    
      

      window.onload = loadPage;
</script>
