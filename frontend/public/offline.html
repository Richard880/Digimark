<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#065f46" />
  <title>Sokodigi is offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6faf6; color: #0f172a; text-align: center; }
    main { max-width: 340px; }
    .icon { font-size: 48px; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #475569; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #065f46; color: #fff; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>Sokodigi needs an internet connection to show products, your wallet and your orders. Your money is safe. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
